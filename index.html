<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAP LIVE DASHBOARD</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --dark-header: #111827;
            --accent-blue: #2563eb;
            --accent-green: #16a34a;
            --accent-red: #dc2626;
            --accent-amber: #d97706;
        }

        * {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 24px;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header Bar */
        .top-bar {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            padding: 22px 28px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.2);
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .top-bar-left h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .top-bar-left p {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 3px;
        }

        .sync-badge {
            background-color: rgba(255, 255, 255, 0.08);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.25);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
        }

        .sync-dot {
            width: 8px;
            height: 8px;
            background-color: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 8px #4ade80;
        }

        /* KPI Cards Grid */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .kpi-card {
            background: var(--card-bg);
            padding: 22px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            border: 1px solid #f1f5f9;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .kpi-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }

        .kpi-info h3 {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 800;
            letter-spacing: 0.6px;
            margin-bottom: 8px;
        }

        .kpi-info .value {
            font-size: 32px;
            font-weight: 800;
            line-height: 1;
        }

        .kpi-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .kpi-total .value { color: var(--text-main); }
        .kpi-total .kpi-icon { background: #e0f2fe; }

        .kpi-success .value { color: var(--accent-green); }
        .kpi-success .kpi-icon { background: #dcfce7; }

        .kpi-pending .value { color: var(--accent-red); }
        .kpi-pending .kpi-icon { background: #fee2e2; }

        .kpi-action .value { color: var(--accent-amber); }
        .kpi-action .kpi-icon { background: #fef3c7; }

        /* Main Table & Filters */
        .main-content {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid #f1f5f9;
        }

        .controls-row {
            display: flex;
            gap: 14px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .controls-row select, .controls-row input {
            padding: 12px 18px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: #f8fafc;
            font-size: 14px;
            font-weight: 500;
            outline: none;
            color: var(--text-main);
            transition: all 0.2s;
        }

        .controls-row select:focus, .controls-row input:focus {
            background-color: #ffffff;
            border-color: #94a3b8;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .search-input {
            flex: 1;
            min-width: 280px;
        }

        /* Table Styling */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        th {
            background-color: #f8fafc;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 16px 20px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th:first-child { border-top-left-radius: 12px; }
        th:last-child { border-top-right-radius: 12px; }

        td {
            padding: 18px 20px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 14px;
            color: var(--text-main);
            vertical-align: middle;
        }

        tr:last-child td { border-bottom: none; }

        .count-col {
            font-weight: 700;
            color: var(--text-muted);
            font-size: 13px;
        }

        .vehicle-badge {
            background: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
            padding: 7px 14px;
            border-radius: 10px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            background: #fffbeeb;
            color: #b45309;
            border: 1px solid #fde68a;
        }

        .owner-text {
            font-weight: 700;
            color: #1e293b;
        }

        .btn-action {
            background: #ffffff;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-action:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
            transform: translateY(-1px);
        }

        .loader {
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Modal Details */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 28px;
            border-radius: 20px;
            max-width: 520px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 20px; right: 24px;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .detail-label { font-weight: 600; color: var(--text-muted); font-size: 13px; }
        .detail-value { color: var(--text-main); font-weight: 600; font-size: 14px; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="top-bar">
            <div class="top-bar-left">
                <span style="font-size:28px;">🚛</span>
                <div>
                    <h1>AAP LIVE DASHBOARD</h1>
                    <p>Managed by MRATYUNJAY • Real-time Sync ⚡</p>
                </div>
            </div>
            <div class="sync-badge">
                <span class="sync-dot"></span> Live Sheet Sync
            </div>
        </div>

        <!-- KPI Cards -->
        <div class="kpi-grid">
            <div class="kpi-card kpi-total">
                <div class="kpi-info">
                    <h3>TOTAL CASES 📁</h3>
                    <div class="value" id="totalCount">0</div>
                </div>
                <div class="kpi-icon">📁</div>
            </div>
            <div class="kpi-card kpi-success">
                <div class="kpi-info">
                    <h3>CERTIFICATE ISSUED</h3>
                    <div class="value" id="successCount">0</div>
                </div>
                <div class="kpi-icon">✔</div>
            </div>
            <div class="kpi-card kpi-pending">
                <div class="kpi-info">
                    <h3>PENDING ⏳</h3>
                    <div class="value" id="pendingCount">0</div>
                </div>
                <div class="kpi-icon">⚠️</div>
            </div>
            <div class="kpi-card kpi-action">
                <div class="kpi-info">
                    <h3>NEED ACTION 🛠️</h3>
                    <div class="value" id="actionCount">0</div>
                </div>
                <div class="kpi-icon">⚡</div>
            </div>
        </div>

        <!-- Filters & Table -->
        <div class="main-content">
            <div class="controls-row">
                <select id="stateFilter" onchange="filterData()">
                    <option value="ALL">All States 🗺️</option>
                </select>

                <select id="remarkFilter" onchange="filterData()">
                    <option value="ALL">All Status / Remarks</option>
                </select>

                <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search Vehicle, Owner, State..." oninput="filterData()">
            </div>

            <div id="loader" class="loader">डेटा लोड हो रहा है, कृपया प्रतीक्षा करें...</div>

            <div class="table-responsive">
                <table id="dataTable" style="display: none;">
                    <thead>
                        <tr>
                            <th>COUNTING</th>
                            <th>VEHICLE NUMBER</th>
                            <th>REMARK</th>
                            <th>OWNER NAME</th>
                            <th>ACTION</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Details Modal -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle" style="margin-bottom: 20px; font-size: 20px; font-weight: 800;">Vehicle Details</h2>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. अपना Apps Script Web App URL यहाँ डालें
        // ==========================================
        const API_URL = "https://script.google.com/macros/s/AKfycbwpn2sSMdXpn6SmixqeCyHEcEA3wIBqvktPK1wA0Lf7ITljadaCanI7zsU6f8GrXrPuVA/exec"; 

        // ==========================================
        // 2. अपनी Google Sheet के सटीक Headers सेट करें
        // ==========================================
        const HEADERS = {
            VEHICLE: "Vehicle no.",    // अपनी शीट में जो Vehicle Number का नाम हो
            REMARK: "Remarks",          // अपनी शीट में जो Remark / Status का नाम हो
            OWNER: "permit holder name",  // अपनी शीट में जो Owner Name का नाम हो
            STATE: "Portal"             // अपनी शीट में जो State कॉलम का नाम हो (यदि हो)
        };

        let masterData = [];

        function loadData() {
            const script = document.createElement('script');
            script.src = `${API_URL}?callback=handleData`;
            document.body.appendChild(script);
        }

        function getValueByHeader(rowObj, headerName) {
            if (!rowObj || !headerName) return '';
            // Case-insensitive & Whitespace-trimmed matching for exact header
            const key = Object.keys(rowObj).find(k => k.trim().toLowerCase() === headerName.trim().toLowerCase());
            return key ? rowObj[key] : '';
        }

        function handleData(data) {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('dataTable').style.display = 'table';

            if (data.error) {
                alert("Error fetching data: " + data.error);
                return;
            }

            masterData = data;
            populateDropdowns();
            filterData();
        }

        function populateDropdowns() {
            const remarks = new Set();
            const states = new Set();

            masterData.forEach(item => {
                const remVal = getValueByHeader(item, HEADERS.REMARK);
                const vehVal = getValueByHeader(item, HEADERS.VEHICLE);
                const stateVal = getValueByHeader(item, HEADERS.STATE);

                if (remVal) remarks.add(String(remVal).trim());

                if (stateVal) {
                    states.add(String(stateVal).trim());
                } else if (vehVal) {
                    // अगर State कॉलम अलग नहीं है, तो गाड़ी नंबर के शुरूआती अक्षर (जैसे GJ, HR, PB) ले लेगा
                    const match = String(vehVal).trim().match(/^[A-Za-z]{2}/);
                    if (match) states.add(match[0].toUpperCase());
                }
            });

            // Populate Remark Dropdown
            const remarkSelect = document.getElementById('remarkFilter');
            let remarkHTML = '<option value="ALL">All Status / Remarks</option>';
            remarks.forEach(rem => {
                remarkHTML += `<option value="${rem}">${rem}</option>`;
            });
            remarkSelect.innerHTML = remarkHTML;

            // Populate State Dropdown
            const stateSelect = document.getElementById('stateFilter');
            let stateHTML = '<option value="ALL">All States 🗺️</option>';
            states.forEach(st => {
                stateHTML += `<option value="${st}">${st}</option>`;
            });
            stateSelect.innerHTML = stateHTML;
        }

        function filterData() {
            const searchValue = document.getElementById('searchInput').value.toLowerCase();
            const selectedRemark = document.getElementById('remarkFilter').value;
            const selectedState = document.getElementById('stateFilter').value;

            const filtered = masterData.filter(item => {
                const vehVal = String(getValueByHeader(item, HEADERS.VEHICLE)).trim();
                const remVal = String(getValueByHeader(item, HEADERS.REMARK)).trim();
                const stateVal = String(getValueByHeader(item, HEADERS.STATE)).trim();

                // Search Filter
                const matchesSearch = Object.values(item).some(val => 
                    String(val).toLowerCase().includes(searchValue)
                );

                // Remark Filter
                const matchesRemark = (selectedRemark === 'ALL') || (remVal === selectedRemark);

                // State Filter
                let matchesState = true;
                if (selectedState !== 'ALL') {
                    if (stateVal) {
                        matchesState = (stateVal.toUpperCase() === selectedState.toUpperCase());
                    } else if (vehVal) {
                        matchesState = vehVal.toUpperCase().startsWith(selectedState.toUpperCase());
                    }
                }

                return matchesSearch && matchesRemark && matchesState;
            });

            renderDashboard(filtered);
        }

        function renderDashboard(data) {
            // Update Card Counts Dynamic
            document.getElementById('totalCount').innerText = data.length;
            
            let pending = 0, action = 0, success = 0;
            data.forEach(item => {
                const status = String(getValueByHeader(item, HEADERS.REMARK)).toLowerCase();
                if (status.includes('pending') || status.includes('wait')) pending++;
                if (status.includes('action') || status.includes('need') || status.includes('rto')) action++;
                if (status.includes('issued') || status.includes('done') || status.includes('success') || status.includes('complete')) success++;
            });

            document.getElementById('pendingCount').innerText = pending;
            document.getElementById('actionCount').innerText = action;
            document.getElementById('successCount').innerText = success;

            // Render Table Rows
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            data.forEach((item, index) => {
                const tr = document.createElement('tr');
                const regNo = getValueByHeader(item, HEADERS.VEHICLE) || 'N/A';
                const owner = getValueByHeader(item, HEADERS.OWNER) || 'N/A';
                const remark = getValueByHeader(item, HEADERS.REMARK) || 'N/A';

                tr.innerHTML = `
                    <td class="count-col">${index + 1}</td>
                    <td>
                        <span class="vehicle-badge">
                            🚌 ${regNo}
                        </span>
                    </td>
                    <td>
                        <span class="status-pill">
                            ⚡ ${remark}
                        </span>
                    </td>
                    <td><span class="owner-text">${owner}</span></td>
                    <td>
                        <button class="btn-action" onclick='openVehicleDetail(${JSON.stringify(item).replace(/'/g, "&apos;")})'>
                            👁️ View All
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openVehicleDetail(item) {
            const vehNo = getValueByHeader(item, HEADERS.VEHICLE) || 'Vehicle Details';
            document.getElementById('modalTitle').innerText = vehNo;
            const body = document.getElementById('modalBody');
            body.innerHTML = '';

            Object.entries(item).forEach(([key, val]) => {
                const detailItem = document.createElement('div');
                detailItem.className = 'detail-item';
                detailItem.innerHTML = `<div class="detail-label">${key}</div><div class="detail-value">${val || '-'}</div>`;
                body.appendChild(detailItem);
            });

            document.getElementById('detailModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        window.onload = loadData;
    </script>
</body>
</html>
