<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANINDIA LIVE DASHBOARD - PREMIUM</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-amber: #f59e0b;
        }

        * {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 24px;
            min-height: 100vh;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Top Modern Bar */
        .top-bar {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid var(--card-border);
            color: #ffffff;
            padding: 24px 32px;
            border-radius: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .top-bar-left h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .top-bar-left p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .sync-badge {
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.3);
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(8px);
        }

        .sync-dot {
            width: 9px;
            height: 9px;
            background-color: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 10px #34d399;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.3); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* KPI Interactive Cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 28px;
        }

        .kpi-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 24px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .kpi-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .kpi-card.active {
            border: 2px solid var(--accent-blue);
            background: rgba(30, 41, 59, 0.9);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        .kpi-info h3 {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 800;
            letter-spacing: 0.8px;
            margin-bottom: 10px;
        }

        .kpi-info .value {
            font-size: 36px;
            font-weight: 800;
            line-height: 1;
        }

        .kpi-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .kpi-total .value { color: var(--text-main); }
        .kpi-total .kpi-icon { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }

        .kpi-success .value { color: var(--accent-green); }
        .kpi-success .kpi-icon { background: rgba(16, 185, 129, 0.15); color: #34d399; }

        .kpi-pending .value { color: var(--accent-red); }
        .kpi-pending .kpi-icon { background: rgba(239, 68, 68, 0.15); color: #f87171; }

        .kpi-action .value { color: var(--accent-amber); }
        .kpi-action .kpi-icon { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }

        /* Main Section Controls & Table */
        .main-content {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .controls-row {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .controls-row select, .controls-row input {
            padding: 14px 20px;
            border: 1px solid var(--card-border);
            border-radius: 14px;
            background-color: #0f172a;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            color: var(--text-main);
            transition: all 0.2s;
        }

        .controls-row select:focus, .controls-row input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .search-input {
            flex: 1;
            min-width: 280px;
        }

        /* Table Styling */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        th {
            background-color: #0f172a;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 18px 20px;
            text-align: left;
            border-bottom: 1px solid var(--card-border);
        }

        th:first-child { border-top-left-radius: 14px; }
        th:last-child { border-top-right-radius: 14px; }

        td {
            padding: 18px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 14px;
            color: var(--text-main);
            vertical-align: middle;
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .count-col {
            font-weight: 700;
            color: var(--text-muted);
        }

        .vehicle-badge {
            background: rgba(59, 130, 246, 0.1);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            background: rgba(245, 158, 11, 0.1);
            color: #fcd34d;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .owner-text {
            font-weight: 600;
            color: #e2e8f0;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-action:hover {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #fff;
        }

        .loader {
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Modal Details */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 32px;
            border-radius: 24px;
            max-width: 550px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .close-btn {
            position: absolute;
            top: 20px; right: 24px;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .detail-label { font-weight: 600; color: var(--text-muted); font-size: 13px; }
        .detail-value { color: var(--text-main); font-weight: 700; font-size: 14px; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-bar-left">
                <span style="font-size:32px;">🚛</span>
                <div>
                    <h1>PANINDIA LIVE DASHBOARD</h1>
                    <p>Managed by MRATYUNJAY • Real-time Sync ⚡</p>
                </div>
            </div>
            <div class="sync-badge">
                <span class="sync-dot"></span> Live Auto Sync (10s)
            </div>
        </div>

        <!-- Interactive KPI Cards -->
        <div class="kpi-grid">
            <div class="kpi-card kpi-total active" id="card-ALL" onclick="setCardFilter('ALL')">
                <div class="kpi-info">
                    <h3>TOTAL CASES 📁</h3>
                    <div class="value" id="totalCount">0</div>
                </div>
                <div class="kpi-icon">📁</div>
            </div>
            <div class="kpi-card kpi-success" id="card-SUCCESS" onclick="setCardFilter('SUCCESS')">
                <div class="kpi-info">
                    <h3>CERTIFICATE ISSUED</h3>
                    <div class="value" id="successCount">0</div>
                </div>
                <div class="kpi-icon">✔</div>
            </div>
            <div class="kpi-card kpi-pending" id="card-PENDING" onclick="setCardFilter('PENDING')">
                <div class="kpi-info">
                    <h3>PENDING ⏳</h3>
                    <div class="value" id="pendingCount">0</div>
                </div>
                <div class="kpi-icon">⚠️</div>
            </div>
            <div class="kpi-card kpi-action" id="card-ACTION" onclick="setCardFilter('ACTION')">
                <div class="kpi-info">
                    <h3>NEED ACTION 🛠️</h3>
                    <div class="value" id="actionCount">0</div>
                </div>
                <div class="kpi-icon">⚡</div>
            </div>
        </div>

        <!-- Filters & Table -->
        <div class="main-content">
            <div class="controls-row">
                <select id="stateFilter" onchange="filterData()">
                    <option value="ALL">All States </option>
                </select>

                <select id="remarkFilter" onchange="filterData()">
                    <option value="ALL">All Status / Remarks</option>
                </select>

                <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search Vehicle, Owner, State..." oninput="filterData()">
            </div>

            <div id="loader" class="loader">data processing please wait ...</div>

            <div class="table-responsive">
                <table id="dataTable" style="display: none;">
                    <thead>
                        <tr>
                            <th>SR.NO.</th>
                            <th>VEHICLE NUMBER</th>
                            <th>REMARK</th>
                            <th>OWNER NAME</th>
                            <th>ACTION</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Details Modal -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle" style="margin-bottom: 20px; font-size: 20px; font-weight: 800; color: var(--accent-blue);">Vehicle Details</h2>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwpn2sSMdXpn6SmixqeCyHEcEA3wIBqvktPK1wA0Lf7ITljadaCanI7zsU6f8GrXrPuVA/exec"; 

        const HEADERS = {
            VEHICLE: "Vehicle no.",
            REMARK: "Remarks",
            OWNER: "permit holder name",
            STATE: "Portal"
        };

        let masterData = [];
        let activeCardFilter = 'ALL';
        let isFirstLoad = true;

        // Auto Match Headers (Case-insensitive & Whitespace-trimmed)
        function getValueByHeader(rowObj, headerName) {
            if (!rowObj || !headerName) return '';
            const key = Object.keys(rowObj).find(k => k.trim().toLowerCase() === headerName.trim().toLowerCase());
            return key ? rowObj[key] : '';
        }

        // Fetch Data from Apps Script with Cache-Buster
        function loadData() {
            const oldScript = document.getElementById('jsonpScript');
            if (oldScript) oldScript.remove();

            const script = document.createElement('script');
            script.id = 'jsonpScript';
            script.src = `${API_URL}?callback=handleData&_=${new Date().getTime()}`;
            document.body.appendChild(script);
        }

        function handleData(data) {
            if (isFirstLoad) {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('dataTable').style.display = 'table';
                isFirstLoad = false;
            }

            if (data.error) {
                console.error("Error fetching data:", data.error);
                return;
            }

            masterData = data;
            updateKPICounts();
            populateDropdowns();
            filterData();
        }

        // Live Dynamic Counts for KPI Cards
        function updateKPICounts() {
            document.getElementById('totalCount').innerText = masterData.length;
            
            let pending = 0, action = 0, success = 0;
            masterData.forEach(item => {
                const status = String(getValueByHeader(item, HEADERS.REMARK)).toLowerCase();
                if (status.includes('pending') || status.includes('wait')) pending++;
                if (status.includes('action') || status.includes('need') || status.includes('rto')) action++;
                if (status.includes('issued') || status.includes('done') || status.includes('success') || status.includes('complete')) success++;
            });

            document.getElementById('pendingCount').innerText = pending;
            document.getElementById('actionCount').innerText = action;
            document.getElementById('successCount').innerText = success;
        }

        // Click Event for Top Cards
        function setCardFilter(type) {
            activeCardFilter = type;
            
            // Highlight Selected Card
            document.querySelectorAll('.kpi-card').forEach(card => card.classList.remove('active'));
            document.getElementById(`card-${type}`).classList.add('active');

            filterData();
        }

        function populateDropdowns() {
            const currentRemark = document.getElementById('remarkFilter').value;
            const currentState = document.getElementById('stateFilter').value;

            const remarks = new Set();
            const states = new Set();

            masterData.forEach(item => {
                const remVal = getValueByHeader(item, HEADERS.REMARK);
                const vehVal = getValueByHeader(item, HEADERS.VEHICLE);
                const stateVal = getValueByHeader(item, HEADERS.STATE);

                if (remVal) remarks.add(String(remVal).trim());

                if (stateVal) {
                    states.add(String(stateVal).trim());
                } else if (vehVal) {
                    const match = String(vehVal).trim().match(/^[A-Za-z]{2}/);
                    if (match) states.add(match[0].toUpperCase());
                }
            });

            const remarkSelect = document.getElementById('remarkFilter');
            let remarkHTML = '<option value="ALL">All Status / Remarks</option>';
            remarks.forEach(rem => {
                remarkHTML += `<option value="${rem}" ${rem === currentRemark ? 'selected' : ''}>${rem}</option>`;
            });
            remarkSelect.innerHTML = remarkHTML;

            const stateSelect = document.getElementById('stateFilter');
            let stateHTML = '<option value="ALL">All States 🗺️</option>';
            states.forEach(st => {
                stateHTML += `<option value="${st}" ${st === currentState ? 'selected' : ''}>${st}</option>`;
            });
            stateSelect.innerHTML = stateHTML;
        }

        function filterData() {
            const searchValue = document.getElementById('searchInput').value.toLowerCase();
            const selectedRemark = document.getElementById('remarkFilter').value;
            const selectedState = document.getElementById('stateFilter').value;

            const filtered = masterData.filter(item => {
                const vehVal = String(getValueByHeader(item, HEADERS.VEHICLE)).trim();
                const remVal = String(getValueByHeader(item, HEADERS.REMARK)).trim();
                const stateVal = String(getValueByHeader(item, HEADERS.STATE)).trim();
                const statusLower = remVal.toLowerCase();

                // 1. KPI Card Click Logic Filter
                let matchesCard = true;
                if (activeCardFilter === 'SUCCESS') {
                    matchesCard = statusLower.includes('issued') || statusLower.includes('done') || statusLower.includes('success') || statusLower.includes('complete');
                } else if (activeCardFilter === 'PENDING') {
                    matchesCard = statusLower.includes('pending') || statusLower.includes('wait');
                } else if (activeCardFilter === 'ACTION') {
                    matchesCard = statusLower.includes('action') || statusLower.includes('need') || statusLower.includes('rto');
                }

                // 2. Search Text Logic Filter
                const matchesSearch = Object.values(item).some(val => 
                    String(val).toLowerCase().includes(searchValue)
                );

                // 3. Dropdown Logic Filter
                const matchesRemark = (selectedRemark === 'ALL') || (remVal === selectedRemark);

                let matchesState = true;
                if (selectedState !== 'ALL') {
                    if (stateVal) {
                        matchesState = (stateVal.toUpperCase() === selectedState.toUpperCase());
                    } else if (vehVal) {
                        matchesState = vehVal.toUpperCase().startsWith(selectedState.toUpperCase());
                    }
                }

                return matchesCard && matchesSearch && matchesRemark && matchesState;
            });

            renderDashboard(filtered);
        }

        function renderDashboard(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            data.forEach((item, index) => {
                const tr = document.createElement('tr');
                const regNo = getValueByHeader(item, HEADERS.VEHICLE) || 'N/A';
                const owner = getValueByHeader(item, HEADERS.OWNER) || 'N/A';
                const remark = getValueByHeader(item, HEADERS.REMARK) || 'N/A';

                tr.innerHTML = `
                    <td class="count-col">${index + 1}</td>
                    <td>
                        <span class="vehicle-badge">
                            🚌 ${regNo}
                        </span>
                    </td>
                    <td>
                        <span class="status-pill">
                            ⚡ ${remark}
                        </span>
                    </td>
                    <td><span class="owner-text">${owner}</span></td>
                    <td>
                        <button class="btn-action" onclick='openVehicleDetail(${JSON.stringify(item).replace(/'/g, "&apos;")})'>
                            👁️ View All
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openVehicleDetail(item) {
            const vehNo = getValueByHeader(item, HEADERS.VEHICLE) || 'Vehicle Details';
            document.getElementById('modalTitle').innerText = vehNo;
            const body = document.getElementById('modalBody');
            body.innerHTML = '';

            Object.entries(item).forEach(([key, val]) => {
                const detailItem = document.createElement('div');
                detailItem.className = 'detail-item';
                detailItem.innerHTML = `<div class="detail-label">${key}</div><div class="detail-value">${val || '-'}</div>`;
                body.appendChild(detailItem);
            });

            document.getElementById('detailModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        // Initialize and Start 10-Second Auto Sync
        window.onload = () => {
            loadData();
            setInterval(loadData, 10000); // 10000 ms = 10 Sec
        };
    </script>
</body>
</html>
